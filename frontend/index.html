<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bolo Marwadi — मोतीराम से बात करो</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
    }

    #bg {
      position: fixed;
      inset: 0;
      background: url('assets/rajBg.png') center center / cover no-repeat;
      z-index: 0;
    }

    /* subtle warm overlay so text pops */
    #bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(30, 15, 5, 0.35) 0%,
        rgba(30, 15, 5, 0.15) 40%,
        rgba(30, 15, 5, 0.55) 100%
      );
    }

    /* ── title bar ── */
    #title {
      position: fixed;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
    }

    #title h1 {
      font-size: 2.2rem;
      font-weight: 700;
      color: #fff5e0;
      text-shadow: 0 2px 12px rgba(0,0,0,0.6);
      letter-spacing: 2px;
    }

    #title p {
      font-size: 0.95rem;
      color: #f5d99a;
      text-shadow: 0 1px 6px rgba(0,0,0,0.5);
      margin-top: 4px;
    }

    /* ── speech bubble ── */
    #bubble-wrap {
      position: fixed;
      bottom: 46vh;
      right: 38vw;
      z-index: 20;
      max-width: 340px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.35s ease, transform 0.35s ease;
      pointer-events: none;
    }

    #bubble-wrap.visible {
      opacity: 1;
      transform: translateY(0);
    }

    #bubble {
      background: rgba(255, 248, 230, 0.96);
      border-radius: 18px 18px 4px 18px;
      padding: 14px 18px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.3);
      border: 2px solid #d4a03a;
    }

    #bubble-name {
      font-size: 0.72rem;
      font-weight: 700;
      color: #b8701a;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    #bubble-text {
      font-size: 1.05rem;
      color: #2c1a00;
      line-height: 1.55;
    }

    /* typing dots */
    #typing {
      display: none;
      gap: 5px;
      align-items: center;
      height: 22px;
    }

    #typing.show { display: flex; }

    #typing span {
      width: 8px; height: 8px;
      background: #b8701a;
      border-radius: 50%;
      animation: bounce 0.9s infinite ease-in-out;
    }
    #typing span:nth-child(2) { animation-delay: 0.15s; }
    #typing span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }

    /* ── chill guy character ── */
    #character {
      position: fixed;
      bottom: 0;
      right: 0;
      z-index: 15;
      height: 88vh;
      width: auto;
      filter: drop-shadow(0 12px 32px rgba(0,0,0,0.5));
      transition: transform 0.3s ease;
    }

    #character.talking {
      animation: sway 0.6s ease-in-out infinite alternate;
    }

    @keyframes sway {
      from { transform: rotate(-1.5deg) translateY(0); }
      to   { transform: rotate(1.5deg) translateY(-4px); }
    }

    /* ── status indicator ── */
    #status {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0,0,0,0.5);
      border-radius: 20px;
      padding: 7px 18px;
      backdrop-filter: blur(6px);
    }

    #status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #888;
      transition: background 0.3s;
    }

    #status-dot.listening { background: #4cd964; animation: pulse 1.2s infinite; }
    #status-dot.thinking  { background: #f5a623; animation: pulse 0.8s infinite; }
    #status-dot.speaking  { background: #e74c3c; animation: pulse 0.5s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    #status-label {
      font-size: 0.82rem;
      color: #f0e6d0;
      letter-spacing: 0.5px;
    }

    /* ── transcript history (left panel) ── */
    #history {
      position: fixed;
      top: 90px;
      left: 24px;
      bottom: 60px;
      width: 300px;
      z-index: 10;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 6px;
    }

    #history::-webkit-scrollbar { width: 4px; }
    #history::-webkit-scrollbar-track { background: transparent; }
    #history::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

    .msg {
      border-radius: 12px;
      padding: 10px 13px;
      font-size: 0.88rem;
      line-height: 1.5;
      max-width: 100%;
      word-wrap: break-word;
      animation: fadein 0.3s ease;
    }

    @keyframes fadein {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user {
      background: rgba(255,255,255,0.18);
      color: #fff5e0;
      border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(4px);
      align-self: flex-start;
    }

    .msg.user::before {
      content: 'You  ';
      font-weight: 700;
      font-size: 0.72rem;
      color: #f5d99a;
      letter-spacing: 0.5px;
      display: block;
      margin-bottom: 3px;
    }

    .msg.motiram {
      background: rgba(212, 160, 58, 0.25);
      color: #fff8e8;
      border: 1px solid rgba(212, 160, 58, 0.35);
      backdrop-filter: blur(4px);
      align-self: flex-start;
    }

    .msg.motiram::before {
      content: 'मोतीराम';
      font-weight: 700;
      font-size: 0.72rem;
      color: #f5d99a;
      letter-spacing: 0.5px;
      display: block;
      margin-bottom: 3px;
    }
  </style>
</head>
<body>

  <div id="bg"></div>

  <div id="title">
    <h1>बोलो मारवाड़ी</h1>
    <p>मोतीराम से हिंदी या English में बात करो</p>
  </div>

  <!-- transcript history -->
  <div id="history"></div>

  <!-- speech bubble above character -->
  <div id="bubble-wrap">
    <div id="bubble">
      <div id="bubble-name">मोतीराम</div>
      <div id="typing"><span></span><span></span><span></span></div>
      <div id="bubble-text"></div>
    </div>
  </div>

  <!-- chill guy character -->
  <img id="character" src="assets/chillGuy_nobg.png" alt="Motiram" />

  <!-- status bar -->
  <div id="status">
    <div id="status-dot"></div>
    <span id="status-label">Connecting...</span>
  </div>

  <script>
    const statusDot   = document.getElementById('status-dot');
    const statusLabel = document.getElementById('status-label');
    const character   = document.getElementById('character');
    const bubbleWrap  = document.getElementById('bubble-wrap');
    const bubbleText  = document.getElementById('bubble-text');
    const typing      = document.getElementById('typing');
    const history     = document.getElementById('history');

    function setStatus(state) {
      statusDot.className = '';
      statusDot.classList.add(state);
      const labels = {
        listening: 'सुन रहा हूँ... (Listening)',
        thinking:  'सोच रहा हूँ... (Thinking)',
        speaking:  'मोतीराम बोल रहा छे...',
        idle:      'तैयार छे'
      };
      statusLabel.textContent = labels[state] || state;
    }

    function addMessage(role, text) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.textContent = text;
      history.appendChild(div);
      history.scrollTop = history.scrollHeight;
    }

    function showBubble(text) {
      typing.classList.remove('show');
      bubbleText.textContent = text;
      bubbleWrap.classList.add('visible');
      character.classList.add('talking');
    }

    function showTyping() {
      bubbleText.textContent = '';
      typing.classList.add('show');
      bubbleWrap.classList.add('visible');
      character.classList.remove('talking');
    }

    function hideBubble() {
      bubbleWrap.classList.remove('visible');
      character.classList.remove('talking');
    }

    // ── WebSocket connection to Python backend ──
    let ws;
    let reconnectTimer;

    function connect() {
      ws = new WebSocket('ws://localhost:8765');

      ws.onopen = () => {
        clearTimeout(reconnectTimer);
        setStatus('listening');
      };

      ws.onclose = () => {
        setStatus('idle');
        statusLabel.textContent = 'Reconnecting...';
        reconnectTimer = setTimeout(connect, 2000);
      };

      ws.onerror = () => ws.close();

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);

        if (msg.type === 'transcript') {
          addMessage('user', msg.text);
          showTyping();
          setStatus('thinking');
        }

        if (msg.type === 'response') {
          showBubble(msg.text);
          addMessage('motiram', msg.text);
          setStatus('speaking');
        }

        if (msg.type === 'done') {
          setTimeout(hideBubble, 1800);
          setStatus('listening');
        }

        if (msg.type === 'status') {
          setStatus(msg.state);
        }
      };
    }

    connect();
  </script>
</body>
</html>
